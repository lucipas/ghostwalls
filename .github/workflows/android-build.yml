name: android-build
# CI/CD builds the Android MVP. Developers do NOT build locally.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # NOTE: ubuntu-latest already ships the Android SDK (ANDROID_SDK_ROOT set).
      # Do NOT use android-actions/setup-android@v3 — it calls
      # `sdkmanager "tools"` which no longer exists and fails with
      # "Failed to find package 'tools'" (exit code 1).
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      # Fail early with a clear message if prebuild did not generate a Gradle project.
      - run: |
          echo "== repo root ==" && ls -la
          echo "== android/ ==" && ls -la android
          test -f android/settings.gradle || test -f android/settings.gradle.kts || (echo "ERROR: expo prebuild did not generate android/settings.gradle" && exit 1)
          test -f android/gradlew || (echo "ERROR: android/gradlew missing" && exit 1)
          chmod +x android/gradlew
      - run: ./android/gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with: { name: ghostwalls-android, path: android/app/build/outputs/apk/release/*.apk }
      # Alternative: EAS — uncomment if using Expo cloud builds:
      # - run: npm install -g eas-cli && eas build --platform android --profile production --non-interactive
