name: android-build
# CI/CD builds the Android MVP. Developers do NOT build locally.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      - run: ./android/gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ghostwalls-android, path: android/app/build/outputs/apk/release/*.apk }
      # Alternative: EAS — uncomment if using Expo cloud builds:
      # - run: npm install -g eas-cli && eas build --platform android --profile production --non-interactive
